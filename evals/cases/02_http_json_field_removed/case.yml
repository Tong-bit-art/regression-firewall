name: http_json_field_removed
surface: http
description: "GET /users/42 response loses the email field."
mutations:
    - file: server.py
      find: |-
        "username": "alice", "email": "alice@example.com",
      replace: |-
        "username": "alice",
expect:
  changes:
    - surface: http
      target: "GET /users/42"
      category: field_removed
      path: "$.email"
      classification: unexpected
      severity: high
  verdict: BLOCK
