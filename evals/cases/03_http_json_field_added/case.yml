name: http_json_field_added
surface: http
description: "GET /users/42 response gains a debug field (additive, low severity)."
mutations:
    - file: server.py
      find: |-
        "username": "alice",
      replace: |-
        "username": "alice", "debug": True,
expect:
  changes:
    - surface: http
      target: "GET /users/42"
      category: field_added
      path: "$.debug"
      classification: uncertain
      severity: low
  verdict: PASS
