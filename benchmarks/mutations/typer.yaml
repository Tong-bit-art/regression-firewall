cases:
- id: typer_ctl_no_change
  type: no_change_control
  repeat: 3
  expected:
    changes: []
    verdict: PASS
- id: typer_ctl_non_behavior
  type: non_behavior_change_control
  edits:
  - file: typer/__init__.py
    find: from .main import Typer as Typer
    replace: 'from .main import Typer as Typer  # benchmark comment'
  expected:
    changes: []
    verdict: PASS
- id: typer_15_symbol_removed
  type: symbol_removed
  edits:
  - file: typer/__init__.py
    find: from .main import launch as launch
    replace: ''
  expected:
    changes:
    - surface: public_api
      target: typer.launch
      category: symbol_removed
      classification: unexpected
      severity: critical
    verdict: BLOCK
- id: typer_16_symbol_added
  type: symbol_added
  edits:
  - file: typer/__init__.py
    find: from .main import run as run
    replace: "from .main import run as run\n\n\ndef benchmark_added() -> str:\n  \
      \  \"\"\"Benchmark: additive public symbol.\"\"\"\n    return \"added\""
  expected:
    changes:
    - surface: public_api
      target: typer.benchmark_added
      category: symbol_added
      classification: uncertain
      severity: info
    verdict: PASS
- id: typer_13_generated_file
  type: generated_file_added
  edits:
  - file: typer/__main__.py
    find: from .cli import main
    replace: 'from pathlib import Path as _Path

      _Path("typer_benchmark_marker.txt").write_text("benchmark")

      from .cli import main'
  expected:
    changes:
    - surface: cli
      category: file_created
      classification: uncertain
      severity: medium
    verdict: REVIEW
