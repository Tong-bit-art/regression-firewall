cases:
- id: pip_tools_ctl_no_change
  type: no_change_control
  repeat: 3
  expected:
    changes: []
    verdict: PASS

- id: pip_tools_ctl_non_behavior
  type: non_behavior_change_control
  edits:
  - file: piptools/__main__.py
    find: '@click.group()'
    replace: '@click.group()  # benchmark comment'
  expected:
    changes: []
    verdict: PASS

- id: pip_tools_11_stdout_changed
  type: stdout_changed
  edits:
  - file: piptools/__main__.py
    find: 'cli.add_command(compile.cli, "compile")'
    replace: 'cli.add_command(compile.cli, "compile (benchmark)")'
  expected:
    changes:
    - {surface: cli, category: stdout_changed, classification: uncertain, severity: low}
    verdict: REVIEW
