cases:
- id: pg_ctl_no_change
  type: no_change_control
  repeat: 3
  expected:
    changes: []
    verdict: PASS

- id: pg_ctl_non_behavior
  type: non_behavior_change_control
  edits:
  - file: src/pluggy/__init__.py
    find: '__all__ = ['
    replace: '__all__ = [  # benchmark comment'
  expected:
    changes: []
    verdict: PASS

- id: pg_15_symbol_removed
  type: symbol_removed
  edits:
  - file: src/pluggy/__init__.py
    find: 'from ._hooks import HookCaller'
    replace: 'from ._hooks import HookImpl'
  - file: src/pluggy/__init__.py
    find: '    "HookCaller",'
    replace: ''
  expected:
    changes:
    - {surface: public_api, target: "pluggy.HookCaller", category: symbol_removed, classification: unexpected, severity: critical}
    - {surface: public_api, target: "pluggy", category: export_changed, classification: unexpected, severity: medium}
    verdict: BLOCK

- id: pg_16_symbol_added
  type: symbol_added
  edits:
  - file: src/pluggy/__init__.py
    find: '__all__ = ['
    replace: "__all__ = [\n    \"benchmark_added\","
  - file: src/pluggy/__init__.py
    find: 'from ._hooks import HookCaller'
    replace: "def benchmark_added(x):\n    return x\n\n\nfrom ._hooks import HookCaller"
  expected:
    changes:
    - {surface: public_api, target: "pluggy.benchmark_added", category: symbol_added, classification: uncertain, severity: info}
    - {surface: public_api, target: "pluggy", category: export_changed, classification: unexpected, severity: medium}
    verdict: REVIEW
