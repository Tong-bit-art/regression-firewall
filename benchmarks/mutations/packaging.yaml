cases:
- id: packaging_ctl_no_change
  type: no_change_control
  repeat: 3
  expected:
    changes: []
    verdict: PASS

- id: packaging_ctl_non_behavior
  type: non_behavior_change_control
  edits:
  - file: src/packaging/version.py
    find: 'def parse(version: str) -> Version:'
    replace: 'def parse(version: str) -> Version:  # benchmark comment'
  expected:
    changes: []
    verdict: PASS

- id: packaging_15_symbol_removed
  type: symbol_removed
  edits:
  - file: src/packaging/version.py
    find: 'def parse(version: str) -> Version:'
    replace: 'def _parse(version: str) -> Version:'
  expected:
    changes:
    - {surface: public_api, target: "packaging.version.parse", category: symbol_removed, classification: unexpected, severity: critical}
    verdict: BLOCK

- id: packaging_17_signature_changed
  type: signature_changed
  edits:
  - file: src/packaging/version.py
    find: 'def parse(version: str) -> Version:'
    replace: 'def parse(version: str, strict: bool) -> Version:'
  expected:
    changes:
    - {surface: public_api, target: "packaging.version.parse", category: signature_changed, classification: unexpected, severity: medium}
    verdict: REVIEW

- id: packaging_16_symbol_added
  type: symbol_added
  edits:
  - file: src/packaging/version.py
    find: 'def parse(version: str) -> Version:'
    replace: "def benchmark_added() -> str:\n    return 'added'\n\n\ndef parse(version: str) -> Version:"
  expected:
    changes:
    - {surface: public_api, target: "packaging.version.benchmark_added", category: symbol_added, classification: uncertain, severity: info}
    verdict: PASS
