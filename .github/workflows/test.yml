name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the primary verification target; 3.11 and 3.13 extend
        # coverage across the supported range (floor is 3.9).
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.11", "3.13"]
        exclude:
          # keep the matrix at 7 jobs; OS coverage is what matters most
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Install from wheel (clean path)
        shell: bash # Windows runners default to PowerShell, which does not expand globs
        run: pip install dist/regression_firewall-*.whl

      - name: Install dev tools
        run: pip install -e ".[dev]"

      - name: macOS loopback diagnostics
        if: runner.os == 'macOS'
        run: |
          /usr/libexec/ApplicationFirewall/socketfilterfw --getglobalstate || true
          /usr/libexec/ApplicationFirewall/socketfilterfw --getblockall || true
          python - <<'PY'
          import socket, threading, time
          srv = socket.socket()
          srv.bind(("127.0.0.1", 0))
          srv.listen(5)
          port = srv.getsockname()[1]
          served = threading.Thread(target=lambda: (srv.accept(),), daemon=True)
          served.start()
          for attempt in range(6):
              t0 = time.monotonic()
              c = socket.socket()
              c.settimeout(2)
              try:
                  c.connect(("127.0.0.1", port))
                  print(f"attempt {attempt}: connect OK in {time.monotonic()-t0:.2f}s")
                  c.close()
                  break
              except OSError as exc:
                  print(f"attempt {attempt}: {exc} after {time.monotonic()-t0:.2f}s")
              finally:
                  c.close()
              time.sleep(0.5)
          srv.close()
          t0 = time.monotonic()
          socket.getfqdn("127.0.0.1")
          print(f"getfqdn(127.0.0.1) took {time.monotonic()-t0:.2f}s")
          PY

      - name: Run tests (unit + integration + evals)
        run: python -m pytest tests -q

      - name: Eval suite metrics
        run: python -m evals.runner
