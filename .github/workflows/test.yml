name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the primary verification target; 3.11 and 3.13 extend
        # coverage across the supported range (floor is 3.9).
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.11", "3.13"]
        exclude:
          # keep the matrix at 7 jobs; OS coverage is what matters most
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Install from wheel (clean path)
        run: pip install dist/regression_firewall-*.whl

      - name: Install dev tools
        run: pip install -e ".[dev]"

      - name: Run tests (unit + integration + evals)
        run: python -m pytest tests -q

      - name: Eval suite metrics
        run: python -m evals.runner
